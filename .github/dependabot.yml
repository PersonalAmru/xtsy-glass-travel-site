# Dependabot configuration
#
# Dependencies are managed by Lovable: bun.lock resolves every package through Lovable's
# package mirror, and Lovable rewrites the lockfile when it changes dependencies. Dependabot's
# routine version-update PRs cannot regenerate that lockfile — the old ones edited a
# package-lock.json the project no longer has — so they are switched off here
# (open-pull-requests-limit: 0). Security alerts and GitHub's security-update PRs are not
# affected by this setting; the nightly "Security checks" workflow also scans bun.lock with
# osv-scanner.
#
# GitHub Actions updates are not configured: the organisation's Actions policy blocks
# marketplace actions, so every workflow uses plain shell steps instead of `uses:`.
# Docs: https://docs.github.com/code-security/dependabot
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
