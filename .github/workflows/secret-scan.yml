name: 🔐 Secret Detection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
        with:
          config-path: .gitleaks.toml

      - name: Check for hardcoded secrets in code
        run: |
          echo "Checking for common secret patterns..."
          
          # Check for hardcoded API keys
          if grep -r "sk-[a-zA-Z0-9]" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "❌ Found potential OpenAI API key in source code"
            exit 1
          fi
          
          # Check for hardcoded database URLs
          if grep -r "postgresql://.*:.*@" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "❌ Found potential database URL in source code"
            exit 1
          fi
          
          # Check for hardcoded JWT secrets
          if grep -r "ey[A-Za-z0-9_-].*\." --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "❌ Found potential JWT token in source code"
            exit 1
          fi
          
          # Check for AWS keys
          if grep -r "AKIA[0-9A-Z]" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "❌ Found potential AWS access key in source code"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets detected in source code"

      - name: Validate environment variables usage
        run: |
          echo "Validating proper environment variable usage..."
          
          # Check that sensitive operations use environment variables
          if grep -r "process\.env\." --include="*.ts" --include="*.tsx" src/; then
            echo "✅ Found proper environment variable usage"
          else
            echo "⚠️ No environment variable usage found - ensure secrets are properly externalized"
          fi
          
          # Ensure no VITE_ vars are used for sensitive data in edge functions
          if grep -r "VITE_.*SECRET\|VITE_.*KEY\|VITE_.*TOKEN" supabase/functions/; then
            echo "❌ Found VITE_ prefix used for sensitive data in edge functions"
            exit 1
          fi
          
          echo "✅ Environment variable usage validation passed"