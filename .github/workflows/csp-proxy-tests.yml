name: Unit tests (incl. CSP + /cs proxy)

# Runs the whole unit suite: the Content-Security-Policy and first-party /cs analytics proxy
# guards it was created for, plus every other tests/*.test.ts file.
#
# Until 30 Oct 2026 this workflow ran ONE file, tests/cspAndProxy.test.ts, and it was the only
# workflow that ran vitest at all, so nine of the ten test files never executed anywhere. Two had
# already gone stale unnoticed: bistroGoogleSync.test.ts still asserted the pre-correction Bistro
# hours, and retiredGroupTour.test.ts had never run once. A test nothing executes is not a guard.
# ZERO `uses:` references (organisation policy blocks marketplace actions): plain git checkout,
# Bun via its install script. The live smoke test runs on demand only, because publishing
# happens from Lovable, not on push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live URL for the proxy smoke test (blank = skip)'
        required: false
        default: 'https://xtsy.one'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.head_ref || github.sha }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      # The whole directory, not one file.
      #
      # This includes bookingFunctionAccess.integration.test.ts, which makes three live calls to
      # production Supabase. That is a deliberate choice: those assertions check that RLS still
      # refuses a guest trying to read password-reset codes or approve a booking, and a check like
      # that is worthless if it only runs when someone remembers. It writes nothing — every call
      # expects a rejection — and its two authenticated cases self-skip without
      # LOVABLE_BROWSER_SUPABASE_SESSION_JSON. The cost is that a Supabase outage fails this job.
      #
      # tests/*.test.ts, not tests/ — vitest's default include also matches *.spec.ts, which
      # picks up tests/visual/modals/*.spec.ts. Those are Playwright specs and abort with
      # "Playwright Test did not expect test.describe() to be called here" under vitest. They
      # need a Playwright runner, which this job does not have.
      - name: Run unit tests
        run: bunx vitest run tests/*.test.ts

  live-smoke:
    name: Live /cs/uxa proxy smoke
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != ''
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.sha }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Smoke test the live proxy + CSP
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: bunx vitest run tests/cspAndProxy.test.ts
