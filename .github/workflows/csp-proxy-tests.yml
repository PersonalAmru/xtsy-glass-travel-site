name: CSP + /cs Proxy Tests

# Guards the Content-Security-Policy and the first-party /cs analytics proxy.
# ZERO `uses:` references (organisation policy blocks marketplace actions): plain git checkout,
# Bun via its install script. The live smoke test runs on demand only, because publishing
# happens from Lovable, not on push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live URL for the proxy smoke test (blank = skip)'
        required: false
        default: 'https://xtsy.one'

permissions:
  contents: read

concurrency:
  group: csp-proxy-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: CSP + proxy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.head_ref || github.sha }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Run CSP + proxy tests
        run: bunx vitest run tests/cspAndProxy.test.ts

  live-smoke:
    name: Live /cs/uxa proxy smoke
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != ''
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.sha }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Smoke test the live proxy + CSP
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: bunx vitest run tests/cspAndProxy.test.ts
