name: Device audit — live (manual)

# On-demand only. Loads key pages of the LIVE site on iPhone/iPad (WebKit, Safari's engine),
# high-end Android phones/tablets (Chromium) and desktop Chrome/Safari, and saves layout,
# tap-target, text-size, error and LCP findings plus screenshots to ci-screenshots (device-audit/).

on:
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated paths (blank = default set of key pages)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD

      - name: Install Bun, Playwright and browsers
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund @playwright/test@1.57 >/dev/null
          npx playwright install --with-deps chromium webkit

      - name: Run device audit
        run: |
          ln -s /tmp/pw/node_modules node_modules
          bunx tsx scripts/audit/device-audit.ts
        env:
          SITE_URL: https://xtsy.one
          OUT_DIR: device-audit
          ROUTES: ${{ inputs.routes }}

      - name: Publish report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q .
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin ci-screenshots 2>/dev/null; then git checkout -q FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
          rm -rf device-audit && mkdir -p device-audit
          cp -r "$GITHUB_WORKSPACE/device-audit/." device-audit/ 2>/dev/null || true
          git add -A
          git commit -q -m "Device audit @ $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:ci-screenshots && exit 0
            git fetch -q --depth=1 origin ci-screenshots && git rebase -q FETCH_HEAD || true
            sleep 5
          done
          exit 1
