name: Live content audit (manual)

# On-demand only — no schedule. Runs the content + facts audit (prices, rating, emails,
# policies, schema, SEO, AEO) against the LIVE site and saves it to ci-screenshots (live-content/).
# Also saves the raw HTML of a few key pages for spot checks.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Content audit on the live site
        run: |
          bun scripts/audit/content-audit.ts
          mkdir -p health/html
          for p in contact privacy-policy luxury-glamping-shillong tours/5n-6d-tawang-tour xtsy-adventure-campsite-dawki tab-bistro; do
            curl -fsSL "https://xtsy.one/$p?live-check=$(date +%s)" -o "health/html/$(echo $p | tr / _).html" || true
          done
        env:
          SITE_URL: https://xtsy.one
          OUT_DIR: health

      - name: Publish report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q .
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin ci-screenshots 2>/dev/null; then git checkout -q FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
          rm -rf live-content && mkdir -p live-content
          cp -r "$GITHUB_WORKSPACE/health/." live-content/
          git add -A
          git commit -q -m "Live content audit @ $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:ci-screenshots && exit 0
            git fetch -q --depth=1 origin ci-screenshots && git rebase -q FETCH_HEAD || true
            sleep 5
          done
          exit 1
