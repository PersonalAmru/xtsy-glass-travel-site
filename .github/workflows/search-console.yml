name: Search Console daily pull

# Pulls the last 28 days of Google Search Console data (clicks, impressions, queries, pages)
# into the ci-screenshots branch under gsc/<date>/ and gsc/latest/, for the daily growth
# forecast. Needs the GSC_SERVICE_ACCOUNT_JSON secret (setup steps in scripts/audit/gsc-pull.ts);
# without it the run succeeds and records that no data was pulled.
# ZERO `uses:` references (organisation policy blocks marketplace actions).

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-console
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Pull Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          OUT_DIR: gsc-out
        run: bun scripts/audit/gsc-pull.ts
      - name: Publish to ci-screenshots
        run: |
          echo '{}' > gsc-out/.keep.json
          bash scripts/audit/perf-publish.sh "$(date -u +%F)" gsc-out gsc
          bash scripts/audit/perf-publish.sh latest gsc-out gsc
