name: Route smoke tests (SSR + hydration)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke test (defaults to a local dev server)"
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        if: ${{ github.event.inputs.base_url == '' }}
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run SSR + hydration smoke tests
        run: bunx tsx scripts/smoke-routes.ts --base "${BASE_URL}" --hydrate --sample 25
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8080' }}
