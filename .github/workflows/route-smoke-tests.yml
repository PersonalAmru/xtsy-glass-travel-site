name: Route smoke tests (SSR + hydration)

# Starts the dev server and checks a sample of routes render on the server and hydrate in the
# browser without errors. ZERO `uses:` references (organisation policy blocks marketplace
# actions): plain git checkout, Bun via its install script, Playwright via bunx.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke test (blank = a local dev server)"
        required: false

permissions:
  contents: read

concurrency:
  group: route-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.head_ref || github.sha }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start dev server
        if: ${{ github.event.inputs.base_url == '' }}
        run: |
          # Public Supabase settings come from .env (empty secrets would override them).
          (bun run dev > dev.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/ && { echo "dev server up after ${i}x2s"; exit 0; }
            sleep 2
          done
          echo "::error::dev server did not start"; tail -60 dev.log; exit 1
      - name: Run SSR + hydration smoke tests
        run: |
          set -o pipefail
          bunx tsx scripts/smoke-routes.ts --base "${BASE_URL}" --hydrate --sample 25 2>&1 | tee smoke.log
          rc=$?
          if [ $rc -ne 0 ]; then grep -iE 'fail|error|✗|❌|missing|invalid|mismatch' smoke.log | head -40 | sed 's/^/::error::/'; fi
          exit $rc
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8080' }}
