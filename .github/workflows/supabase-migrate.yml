name: 🗄️ Supabase Deploy

on:
  push:
    branches: [ main ]
    paths: 
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration files
        run: |
          echo "Validating Supabase migrations..."
          
          # Check for dangerous operations
          if grep -r "DROP TABLE\|TRUNCATE\|DELETE FROM.*WHERE.*1=1" supabase/migrations/; then
            echo "❌ Dangerous operations detected in migrations"
            exit 1
          fi
          
          # Check for proper RLS policies
          migration_files=$(find supabase/migrations -name "*.sql" | wc -l)
          rls_policies=$(grep -r "ENABLE ROW LEVEL SECURITY\|CREATE POLICY" supabase/migrations/ | wc -l)
          
          echo "Found $migration_files migration files"
          echo "Found $rls_policies RLS security configurations"
          
          if [ $migration_files -gt 0 ] && [ $rls_policies -eq 0 ]; then
            echo "⚠️ Warning: Migrations found but no RLS policies detected"
          fi
          
          echo "✅ Migration validation passed"

      - name: Link to Supabase
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Deploy migrations
        run: |
          echo "Deploying database migrations..."
          supabase db push
          
          echo "Deploying edge functions..."
          supabase functions deploy --no-verify-jwt=false
          
          echo "✅ Deployment completed successfully"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          
          # Check if functions are deployed
          supabase functions list
          
          # Verify database status
          supabase db diff
          
          echo "✅ Deployment verification completed"

      - name: Security check post-deployment
        run: |
          echo "Running post-deployment security checks..."
          
          # Check if RLS is enabled on critical tables
          echo "Verifying RLS is enabled on security-critical tables..."
          
          # This would need to be adapted based on your specific tables
          critical_tables=("bookings" "transactions" "security_alerts" "newsletter_subscribers")
          
          for table in "${critical_tables[@]}"; do
            echo "Checking RLS status for table: $table"
            # Add actual RLS verification commands here
          done
          
          echo "✅ Security verification completed"