# Software Composition Analysis (SCA)
# Fails the build when a vulnerable dependency is introduced or updated, so a
# future "bad" dependency bump cannot merge silently. Runs on every push/PR and
# on a daily schedule to catch newly-disclosed advisories against pinned deps.
name: Dependency SCA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Daily at 03:00 UTC — catches advisories disclosed after merge.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (locked)
        run: npm ci

      # Hard gate: any HIGH or CRITICAL advisory fails the job.
      # `overrides` in package.json (d3-color, @babel/runtime) are honored by
      # npm ci, so transitive ReDoS fixes are reflected here.
      - name: Audit for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      # Soft gate: surface moderate advisories in the log without failing,
      # so reviewers see them but routine moderates don't block shipping.
      - name: Report moderate advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=moderate || true

  osv-scanner:
    name: OSV Scanner (Google OSV database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-checks the lockfile against the OSV.dev advisory database — a
      # second, independent SCA source beyond the npm registry advisories.
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --recursive
            ./
