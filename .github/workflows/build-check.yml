name: Build check + screenshots

# Builds every pull request and takes desktop + mobile screenshots of key pages,
# so changes can be reviewed without spending Lovable credits.
#
# Org policy blocks third-party actions, so this uses ZERO `uses:` references
# (plain git checkout, Bun via its install script, Playwright via bunx).
# Screenshots are pushed to the `ci-screenshots` branch under <branch-name>/.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build"
        required: false

permissions:
  contents: write

concurrency:
  group: build-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.event.inputs.ref || github.head_ref || github.sha }}
      BRANCH_NAME: ${{ github.head_ref || github.event.inputs.ref || github.ref_name }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Optimise images (only when .github/optimize-images.flag exists)
        run: |
          set -euo pipefail
          if [ ! -f .github/optimize-images.flag ]; then echo "no flag"; exit 0; fi
          bun add --no-save sharp@0.33.5
          bun scripts/optimize-images.ts
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git rm -q .github/optimize-images.flag
          git add public/img/o src/data/optimizedImages.ts
          git commit -q -m "Optimised WebP images for faster loading"
          git push -q origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Pexels candidates (only when .github/pexels-candidates.flag exists)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f .github/pexels-candidates.flag ]; then echo "no flag"; exit 0; fi
          if [ -z "${PEXELS_API_KEY:-}" ]; then echo "::warning::PEXELS_API_KEY secret is not set yet"; exit 0; fi
          bun add --no-save sharp@0.33.5
          bun scripts/images/pexels-candidates.ts
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git rm -q .github/pexels-candidates.flag
          git add scripts/images/pexels-candidates.json
          git commit -q -m "Pexels candidates for review"
          git push -q origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Apply reviewed Pexels photos (only when .github/pexels-apply.flag exists)
        run: |
          set -euo pipefail
          if [ ! -f .github/pexels-apply.flag ]; then echo "no flag"; exit 0; fi
          bun add --no-save sharp@0.33.5
          bun scripts/images/pexels-apply.ts
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git rm -q .github/pexels-apply.flag
          git add public/img/px src/data/pexelsPhotos.ts
          git commit -q -m "Reviewed Pexels photos for tours, routes and destination guides"
          git push -q origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Self-host brand fonts (only when .github/fetch-fonts.flag exists)
        run: |
          set -euo pipefail
          if [ ! -f .github/fetch-fonts.flag ]; then echo "no flag"; exit 0; fi
          bun scripts/fetch-fonts.ts
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git rm -q .github/fetch-fonts.flag
          git add public/fonts
          git commit -q -m "Self-hosted brand fonts"
          git push -q origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Production build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log || { grep -iE "error|failed" build.log | tail -15 | sed 's/^/::error::/'; exit 1; }

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          (bun run dev > dev.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8080/ || (tail -50 dev.log; exit 1)

      - name: Screenshot key pages
        run: bunx tsx scripts/ci-screenshots.ts
        env:
          BASE_URL: http://localhost:8080
          OUT_DIR: shots
          ROUTES: /book/campsite,/tours/4n-5d-shillong-meghalaya-tour,/tours/7n-guwahati-shillong-kaziranga-tour,/tours/5n-6d-tawang-tour,/tours

      - name: Trip assistant check
        continue-on-error: true
        run: bunx tsx scripts/ci-chat-test.ts
        env:
          BASE_URL: http://localhost:8080
          OUT_DIR: shots

      - name: Production server for the performance audit
        continue-on-error: true
        run: |
          NITRO_PRESET=node-server bun run build > build-node.log 2>&1 || true
          ls .output/server 2>/dev/null | head || true
          if [ -f .output/server/index.mjs ]; then (PORT=4173 node .output/server/index.mjs > prod.log 2>&1 &); fi
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 2; done
          (node scripts/ci-compress-proxy.mjs > proxy.log 2>&1 &)
          sleep 2
          if curl -sf -o /dev/null http://localhost:4174/; then echo "PROD_URL=http://localhost:4174" >> "$GITHUB_ENV"; echo "PERF_SERVER=production+brotli" >> "$GITHUB_ENV"; else echo "PROD_URL=http://localhost:8080" >> "$GITHUB_ENV"; echo "PERF_SERVER=dev" >> "$GITHUB_ENV"; fi

      - name: Server-rendered SEO check (what non-JS crawlers see)
        continue-on-error: true
        run: bunx tsx scripts/ci-seo-check.ts
        env:
          BASE_URL: ${{ env.PROD_URL }}
          OUT_DIR: shots

      - name: Full-site SEO health (every sitemap URL on this build)
        continue-on-error: true
        run: bun scripts/indexing/site-health.ts
        env:
          SITE_URL: ${{ env.PROD_URL }}
          OUT_DIR: shots/health

      - name: Image + performance audit
        continue-on-error: true
        run: |
          bunx tsx scripts/ci-audit.ts
          mkdir -p shots/audit && echo "${PERF_SERVER:-unknown}" > shots/audit/server.txt
          cp build-node.log prod.log shots/audit/ 2>/dev/null || true
        env:
          BASE_URL: ${{ env.PROD_URL }}
          OUT_DIR: shots
          SKIP_IMAGES: "1"
          BASELINE_URL: https://xtsy.one
          PERF_ROUTES: /,/best-hostel-in-shillong,/cheap-hostels-shillong,/shillong-dormitory,/xtsy-270

      - name: Breakpoint audit (7 screen sizes × key pages)
        continue-on-error: true
        run: bunx tsx scripts/ci-breakpoints.ts
        env:
          BASE_URL: ${{ env.PROD_URL }}
          OUT_DIR: shots/bp

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p shots
          cp build.log shots/ 2>/dev/null || true
          cp dev.log shots/ 2>/dev/null || true
          SAFE=$(echo "${BRANCH_NAME}" | tr '/' '-')
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q .
          git config user.name "xtsy-ci"
          git config user.email "ci@xtsy.one"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin ci-screenshots 2>/dev/null; then git checkout -q FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
          rm -rf "$SAFE" && mkdir -p "$SAFE"
          cp -r "$GITHUB_WORKSPACE/shots/." "$SAFE/"
          git add -A
          git commit -q -m "Screenshots for ${BRANCH_NAME} @ ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:ci-screenshots && exit 0
            git fetch -q --depth=1 origin ci-screenshots && git rebase -q FETCH_HEAD || true
            sleep 5
          done
          exit 1
