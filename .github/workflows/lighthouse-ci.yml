name: Lighthouse Core Web Vitals
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to audit (default https://xtsy.one)'
        required: false
        default: 'https://xtsy.one'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Build top-routes URL list
        id: urls
        run: |
          BASE="${{ github.event.inputs.base_url || 'https://xtsy.one' }}"
          # Top SEO routes — KEEP IN SYNC with scripts/postDeploySchemaCheck.ts
          ROUTES=(
            "/"
            "/best-hostel-in-shillong"
            "/hotels-in-shillong"
            "/homestays-in-shillong"
            "/meghalaya-tour-packages"
            "/meghalaya-couple-tour-package"
            "/shillong-tour-package"
            "/things-to-do-in-meghalaya"
            "/best-time-to-visit-meghalaya"
            "/3-day-meghalaya-itinerary"
            "/tours"
          )
          URLS=""
          for r in "${ROUTES[@]}"; do
            [ -n "$URLS" ] && URLS="$URLS,"
            URLS="$URLS$BASE$r"
          done
          echo "urls=$URLS" >> $GITHUB_OUTPUT

      - name: Run Lighthouse CI (${{ matrix.preset }})
        env:
          LHCI_URLS: ${{ steps.urls.outputs.urls }}
          LHCI_PRESET: ${{ matrix.preset }}
        run: |
          # Override preset in config via env (avoids duplicate config files)
          if [ "$LHCI_PRESET" = "mobile" ]; then
            sed -i "s/preset: 'desktop'/preset: 'mobile'/" .lighthouserc.cjs || true
          fi
          lhci autorun --config=.lighthouserc.cjs || EXIT=$?
          exit ${EXIT:-0}

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '.lighthouseci';
            if (!fs.existsSync(dir)) return;
            const links = fs.readdirSync(dir).filter(f => f.endsWith('.json')).slice(0, 3);
            const summary = `### 🚦 Lighthouse (${{ matrix.preset }})\n\n${links.length} report(s) generated. Check the workflow artifacts for full details.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci/
          retention-days: 14
