name: SEO Deploy Gate

# Live checks (daily and on demand): JSON-LD on top routes, SEO meta / soft-404 / hreflang
# monitor, CDN room and panorama images. They run against the live site on a schedule because
# publishing happens from Lovable, not on push.
# The old strict "sitemap vs prerender manifest" diff was retired: the site is server-rendered,
# so there is no prerender manifest; build-check.yml already checks every sitemap URL on each
# pull request's build.
# Lighthouse budgets moved to the full-site performance test (perf-full.yml).
# ZERO `uses:` references (organisation policy blocks marketplace actions).

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live URL to validate (default https://xtsy.one)'
        required: false
        default: 'https://xtsy.one'

permissions:
  contents: read

concurrency:
  group: seo-deploy-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live SEO checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.sha }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://xtsy.one' }}
    steps:
      - name: Checkout (plain git)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_REF}"
          git checkout -q FETCH_HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Validate JSON-LD on top SEO routes
        run: |
          set -o pipefail
          rc=0
          bunx tsx scripts/postDeploySchemaCheck.ts --base "$BASE_URL" --routes top 2>&1 | tee schema.log || rc=$?
          if [ $rc -ne 0 ]; then grep -iE 'fail|error|✗|❌|missing|invalid|mismatch|→|found' schema.log | head -40 | sed 's/^/::error::/'; fi
          exit $rc
      - name: SEO meta + soft-404 + hreflang monitor
        if: always()
        env:
          SEO_ALERT_ENDPOINT: ${{ secrets.SEO_ALERT_ENDPOINT }}
          SEO_ALERT_TOKEN: ${{ secrets.SEO_ALERT_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          bunx tsx scripts/seoMetaMonitor.ts --base "$BASE_URL" 2>&1 | tee seo.log || rc=$?
          if [ $rc -ne 0 ]; then grep -iE 'fail|error|✗|❌|missing|invalid|mismatch|→|found' seo.log | head -40 | sed 's/^/::error::/'; fi
          exit $rc
      - name: CDN room + panorama images return 200
        if: always()
        run: bunx tsx scripts/verify-cdn-images.ts
