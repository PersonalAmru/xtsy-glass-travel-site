        if (!isLovable && document.referrer) {

              isLovable = true;

          } catch(e) {}
        }
        
        // Store flag for other scripts to use
        window.__isLovableAdmin = isLovable;
        if (isLovable) {
          sessionStorage.setItem('xtsy_is_lovable_session', 'true');
        }
        
        // Push initial context to dataLayer (GTM will handle routing)

          'event': 'xtsy_init',

          'event': 'consent_default',
