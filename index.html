      // Performance marker for LCP
      if(window.performance&&performance.mark)performance.mark('lcp-skeleton-rendered');
      
      // Fade out skeleton after React hydrates
      window.__hideLCPSkeleton=function(){
        var s=document.getElementById('lcp-skeleton');
        if(s){s.classList.add('fade-out');setTimeout(function(){s.remove();var c=document.getElementById('lcp-critical-css');if(c)c.remove()},300)}
      };
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Razorpay - on-demand loading only -->
    <script>
      window.loadRazorpay=function(c){if(window.Razorpay){c();return}var s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=c;document.head.appendChild(s)};
    </script>
