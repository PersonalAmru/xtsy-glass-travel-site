name = "xtsy-edge-seo"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = false

# Binds the edge worker — legacy redirects, bot prerender lookups,
# and per-route SEO head rewrite at the edge.
# NOTE: the zone must already be on this Cloudflare account.
# CANARY STEP. The full patterns are xtsy.one/* and www.xtsy.one/*, but this
# Worker has never successfully executed in production: it shared the name
# xtsy-prerender with the Cloudflare Workers Build connected to this repo, and
# a build-connected Worker has its active deployment controlled by that
# pipeline, so wrangler's uploads never went live. Renaming breaks that
# collision, but the first deploy under the new name is unproven, so it is
# bound to one unlisted probe path instead of all traffic. Widen to the full
# patterns only once /__xtsy_worker_probe answers in production.
routes = [
  { pattern = "xtsy.one/__xtsy_worker_probe", zone_name = "xtsy.one" },
]

# ─── KV namespaces ────────────────────────────────────────────────────────────
# IDs are templated in by .github/workflows/cloudflare-deploy.yml using the
# CF_KV_PRERENDER_ID and CF_KV_SLIM_MAP_ID repo secrets. For local `wrangler
# deploy` runs, replace ${...} below with the real namespace IDs first.

# Pre-rendered bot HTML cache.
[[kv_namespaces]]
binding = "PRERENDER_CACHE"
id = "${CF_KV_PRERENDER_ID}"

# Slim per-route SEO metadata map (title + description per slug) used by the
# edge SEO rewriter. Populated by `scripts/generateWorkerSlimMap.ts` → uploaded
# in the deploy workflow.
[[kv_namespaces]]
binding = "SEO_SLIM_MAP"
id = "${CF_KV_SLIM_MAP_ID}"

# ─── Vars consumed by worker.js (legacy redirect resolver fallback) ───────────
[vars]
# These must match the project the app uses (supabase/config.toml). They pointed at a
# retired project, so the worker's redirect lookups and /cs proxy were calling a host that
# does not run seo-redirect-resolver or cs-proxy. Both URLs are public, not secrets.
SUPABASE_URL = "https://kzhsxemkntfwsakhkylt.supabase.co"
SUPABASE_FUNCTIONS_HOST = "https://kzhsxemkntfwsakhkylt.functions.supabase.co"
# SUPABASE_ANON_KEY is injected at deploy time via `wrangler deploy --var` in
# the workflow (kept out of source). Worker tolerates it being absent.

# ─── Observability ────────────────────────────────────────────────────────────
[observability]
enabled = true
